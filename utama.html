<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utama Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navigation">
            <a href="#" id="adminLogo" aria-label="Buka popup login">
                <img src="images/adminBefore.png" alt="Admin Logo" class="before-img">
            </a>
        </nav>
        <div class="logo">
            <img src="images/Logo.png" alt="Main Logo" class="logo-img">
        </div>
    </header>

    <div class="overlay" id="loginOverlay" aria-hidden="true">
        <div class="wrapper" id="loginPopup" role="dialog" aria-modal="true">
            <button type="button" id="closeLogin" class="close-btn" aria-label="Close login dialog">
                <i class="bx bx-x"></i>
            </button>
            <div class="login-img"></div>
            <div class="input-box">
                <input type="text" placeholder="Username" required id="usn">
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
